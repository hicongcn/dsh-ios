# Xcode project generation for the DeepSeek Harness iOS client.
#
# Usage:  xcodegen generate     (produces DeepSeekHarness.xcodeproj)
#
# The app is a thin SwiftUI shell over the DSHKit package in this repository, so
# the protocol layer stays buildable and testable without Xcode.
name: DeepSeekHarness
options:
  bundleIdPrefix: ai.deepseek.harness
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top
  generateEmptyDirectories: false

packages:
  DSHKit:
    path: .

settings:
  base:
    SWIFT_VERSION: "6.0"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_STRICT_CONCURRENCY: complete

targets:
  DeepSeekHarness:
    type: application
    platform: iOS
    sources:
      - path: Apps/DeepSeekHarness/Sources
    dependencies:
      - package: DSHKit
        product: DSHKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ai.deepseek.harness.ios
        # Deliberately no spaces: the bundle name becomes a filesystem path, and
        # `DeepSeek Harness.app` breaks naive shell and archive tooling in CI.
        # The name users see on the Home Screen comes from CFBundleDisplayName.
        PRODUCT_NAME: DeepSeekHarness
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        # An explicit Info.plist carries the ATS exceptions below, so Xcode must
        # not also synthesize one; leaving both on makes the merged result
        # ambiguous.
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
    info:
      path: Apps/DeepSeekHarness/Info.plist
      properties:
        CFBundleDisplayName: DeepSeek Harness
        UILaunchScreen: {}
        NSLocalNetworkUsageDescription: "DeepSeek Harness connects to the dsh web host running on your computer to send prompts and stream replies."
        # Allow cleartext to the specific hosts a Harness host runs on rather than
        # globally disabling ATS: loopback for the simulator, and private LAN
        # ranges for a device talking to your computer.
        NSAppTransportSecurity:
          NSExceptionDomains:
            localhost:
              NSExceptionAllowsInsecureHTTPLoads: true
              NSIncludesSubdomains: true
            127.0.0.1:
              NSExceptionAllowsInsecureHTTPLoads: true
          NSAllowsLocalNetworking: true

schemes:
  DeepSeekHarness:
    build:
      targets:
        DeepSeekHarness: all
    run:
      config: Debug
    archive:
      config: Release
