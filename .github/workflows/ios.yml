name: iOS Build

# Builds both iOS apps on a macOS runner, where Xcode is available.
#
#   standalone — the embedded harness: worker bundle, packed VFS image and UI
#                shipped inside the app, so it needs no host and no network
#                beyond the model API.
#   client     — the thin client that drives a `dsh web` host over its protocol.
#
# An unsigned .ipa is produced for each. See "Signing" in README.md for the
# secret-backed path that installs on a physical device.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      assets_url:
        description: "Base URL the harness assets are fetched from"
        type: string
        required: false
        default: "https://hicongcn.github.io/deepseek-harness"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  protocol:
    name: Protocol and asset-server self-tests
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Swift version
        run: swift --version

      - name: Build the packages
        run: swift build

      # DSHKit has no iOS-only dependency, so the wire protocol is verifiable
      # without Xcode. The asset server's checks matter most: one of them asserts
      # that no request can resolve outside the served root.
      - name: DSHKit self-test
        run: swift run dshkit-selftest

      - name: Asset server self-test
        run: swift run dsh-asset-server-selftest

  build:
    name: Build apps + package IPAs
    runs-on: macos-latest
    needs: protocol
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain versions
        run: |
          xcodebuild -version
          xcodebuild -showsdks | grep -i ios || true

      - name: Install xcodegen
        run: brew install xcodegen

      # The harness itself is not in this repository; it is fetched from a build
      # of the upstream project. Failing here is preferable to shipping an app
      # whose page cannot boot.
      - name: Fetch the embedded harness assets
        env:
          HARNESS_ASSETS_URL: ${{ inputs.assets_url || 'https://hicongcn.github.io/deepseek-harness' }}
        run: ./scripts/fetch-harness-assets.sh

      - name: Generate the app icon from the harness brand mark
        run: |
          python3 -m pip install --quiet Pillow
          python3 scripts/make-app-icon.py

      - name: Generate the Xcode project
        run: xcodegen generate

      # A device build, unsigned. CODE_SIGNING_ALLOWED=NO is what lets a runner
      # with no certificates produce a real arm64 binary.
      - name: Build both apps for device (unsigned)
        run: |
          set -o pipefail
          for scheme in DeepSeekHarnessStandalone DeepSeekHarnessClient; do
            echo "=== $scheme ==="
            xcodebuild \
              -project DeepSeekHarness.xcodeproj \
              -scheme "$scheme" \
              -configuration Release \
              -destination 'generic/platform=iOS' \
              -derivedDataPath build \
              CODE_SIGNING_ALLOWED=NO \
              CODE_SIGNING_REQUIRED=NO \
              CODE_SIGN_IDENTITY="" \
              build
          done

      # An .ipa is a zip whose root holds Payload/<App>.app. Assembling it by
      # hand is what makes an unsigned artifact producible without a team.
      - name: Package the standalone IPA
        run: |
          set -euo pipefail
          APP="build/Build/Products/Release-iphoneos/DeepSeekHarness.app"
          if [ ! -d "$APP" ]; then
            echo "::error::standalone app bundle not found at $APP"
            ls -la build/Build/Products/Release-iphoneos/ || true
            exit 1
          fi

          # Report what the app actually carries, so a build that silently lost
          # the harness is caught here rather than on a device.
          echo "bundle size: $(du -sh "$APP" | cut -f1)"
          ls -la "$APP/HarnessAssets/preview/" 2>/dev/null | head || {
            echo "::error::the embedded harness is missing from the app bundle"
            exit 1
          }

          rm -rf artifacts Payload
          mkdir -p artifacts Payload
          cp -R "$APP" Payload/
          zip -qry "artifacts/DeepSeekHarnessStandalone-unsigned.ipa" Payload
          ls -lh artifacts

      - name: Package the client IPA
        run: |
          set -euo pipefail
          APP="build/Build/Products/Release-iphoneos/DeepSeekHarnessClient.app"
          if [ ! -d "$APP" ]; then
            echo "::error::client app bundle not found at $APP"
            exit 1
          fi
          rm -rf Payload-client
          mkdir -p Payload-client/Payload
          cp -R "$APP" Payload-client/Payload/
          (cd Payload-client && zip -qry "../artifacts/DeepSeekHarnessClient-unsigned.ipa" Payload)
          ls -lh artifacts

      # Compiling is not running. This boots a simulator, installs the
      # standalone app, launches it, and confirms it stays alive — so a startup
      # crash fails CI instead of being found by hand.
      - name: Build the standalone app for the simulator
        run: |
          set -o pipefail
          xcodebuild \
            -project DeepSeekHarness.xcodeproj \
            -scheme DeepSeekHarnessStandalone \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build-sim \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Smoke-launch on a simulator
        run: |
          set -euo pipefail

          UDID=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          devices = json.load(sys.stdin)["devices"]
          for runtime, entries in sorted(devices.items()):
              if "iOS" not in runtime:
                  continue
              for device in entries:
                  if device["name"].startswith("iPhone"):
                      print(device["udid"])
                      raise SystemExit
          raise SystemExit("no available iPhone simulator")
          ')
          echo "simulator: $UDID"

          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b

          APP=$(find build-sim/Build/Products -maxdepth 2 -name "DeepSeekHarness.app" -type d | head -1)
          echo "installing: $APP"
          xcrun simctl install "$UDID" "$APP"
          xcrun simctl launch "$UDID" ai.deepseek.harness.standalone

          # Booting the harness loads 844 modules inside a worker, which takes a
          # few seconds; give it real time before judging the launch.
          sleep 20
          if xcrun simctl spawn "$UDID" launchctl list | grep -q ai.deepseek.harness.standalone; then
            echo "app is running"
          else
            echo "::error::the app is not running after launch — it likely crashed"
            xcrun simctl spawn "$UDID" log show --last 3m --predicate 'processImagePath CONTAINS "DeepSeekHarness"' 2>/dev/null | tail -40 || true
            exit 1
          fi

          mkdir -p artifacts/screenshots
          xcrun simctl io "$UDID" screenshot artifacts/screenshots/standalone.png
          ls -lh artifacts/screenshots

      - name: Upload the standalone IPA
        uses: actions/upload-artifact@v4
        with:
          name: DeepSeekHarnessStandalone-unsigned-ipa
          path: artifacts/DeepSeekHarnessStandalone-unsigned.ipa
          if-no-files-found: error

      - name: Upload the client IPA
        uses: actions/upload-artifact@v4
        with:
          name: DeepSeekHarnessClient-unsigned-ipa
          path: artifacts/DeepSeekHarnessClient-unsigned.ipa
          if-no-files-found: warn

      - name: Upload the launch screenshot
        uses: actions/upload-artifact@v4
        with:
          name: DeepSeekHarnessStandalone-screenshot
          path: artifacts/screenshots/
          if-no-files-found: warn
