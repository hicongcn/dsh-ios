# Xcode project generation for the standalone DeepSeek Harness iOS client.
#
# Usage:  xcodegen generate
#
# Two app targets share one protocol package:
#   DeepSeekHarnessStandalone — the app being asked for: it embeds the whole
#       harness (worker bundle + packed VFS image + UI) and runs it on device.
#   DeepSeekHarnessClient — the thin client that drives a `dsh web` host on your
#       computer over its HTTP/WebSocket protocol.
name: DeepSeekHarness
options:
  bundleIdPrefix: ai.deepseek.harness
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top
  generateEmptyDirectories: false

packages:
  DSHKit:
    path: .

settings:
  base:
    SWIFT_VERSION: "6.0"
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_STRICT_CONCURRENCY: complete

targets:
  DeepSeekHarnessStandalone:
    type: application
    platform: iOS
    sources:
      - path: Apps/DeepSeekHarnessStandalone/Sources
      # The asset catalog is compiled, so it stays an ordinary source entry.
      - path: Apps/DeepSeekHarnessStandalone/Resources/Assets.xcassets
      # The bundled harness is a directory tree whose HTML references its assets
      # by relative path. A folder reference copies `HarnessAssets` into the
      # bundle root verbatim, which is exactly the layout the page expects;
      # building it as a group would flatten the tree and break every lookup.
      - path: Apps/DeepSeekHarnessStandalone/Resources/HarnessAssets
        type: folder
        buildPhase: resources
    dependencies:
      - package: DSHKit
        product: DSHAssetServer
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ai.deepseek.harness.standalone
        PRODUCT_NAME: DeepSeekHarness
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # An explicit Info.plist carries the ATS exceptions below, so Xcode must
        # not also synthesize one.
        GENERATE_INFOPLIST_FILE: NO
    info:
      path: Apps/DeepSeekHarnessStandalone/Info.plist
      properties:
        CFBundleDisplayName: DeepSeek Harness
        UILaunchScreen: {}
        UIApplicationSupportsIndirectInputEvents: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # The harness calls the model API directly from the page. That request
        # leaves the device, so App Transport Security applies to it normally;
        # only the embedded loopback server and a LAN host need an exception.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
          NSExceptionDomains:
            localhost:
              NSExceptionAllowsInsecureHTTPLoads: true
              NSIncludesSubdomains: true
            127.0.0.1:
              NSExceptionAllowsInsecureHTTPLoads: true

  DeepSeekHarnessClient:
    type: application
    platform: iOS
    sources:
      - path: Apps/DeepSeekHarness/Sources
    dependencies:
      - package: DSHKit
        product: DSHKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ai.deepseek.harness.ios
        PRODUCT_NAME: DeepSeekHarnessClient
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: NO
    info:
      path: Apps/DeepSeekHarness/Info.plist
      properties:
        CFBundleDisplayName: DeepSeek Harness Client
        UILaunchScreen: {}
        UIApplicationSupportsIndirectInputEvents: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
          NSExceptionDomains:
            localhost:
              NSExceptionAllowsInsecureHTTPLoads: true
              NSIncludesSubdomains: true
            127.0.0.1:
              NSExceptionAllowsInsecureHTTPLoads: true

schemes:
  DeepSeekHarnessStandalone:
    build:
      targets:
        DeepSeekHarnessStandalone: all
    run:
      config: Debug
    archive:
      config: Release
  DeepSeekHarnessClient:
    build:
      targets:
        DeepSeekHarnessClient: all
    run:
      config: Debug
    archive:
      config: Release
