name: iOS Build (signed)

# Produces an installable .ipa by importing a signing identity from secrets.
#
# This is the path that installs on a physical device. The unsigned workflow in
# ios.yml needs no secrets and is enough for simulators and inspection.
#
# Required repository secrets (Settings -> Secrets and variables -> Actions):
#   BUILD_CERTIFICATE_BASE64   base64 of your .p12 signing identity
#   P12_PASSWORD               the .p12 export password
#   BUILD_PROVISION_PROFILE_BASE64  base64 of the .mobileprovision
#   KEYCHAIN_PASSWORD          any throwaway password for the temp keychain
#
# Create the base64 values locally:
#   base64 -i Certificates.p12 | pbcopy
#   base64 -i profile.mobileprovision | pbcopy
#
# An Apple Developer account is required for a Development or Ad Hoc profile.
# A free Apple ID cannot create one, which is the usual reason this job is
# skipped in favour of the unsigned artifact.

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  signed-ipa:
    name: Signed IPA
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fail early when secrets are absent
        run: |
          missing=""
          [ -z "${{ secrets.BUILD_CERTIFICATE_BASE64 }}" ] && missing="$missing BUILD_CERTIFICATE_BASE64"
          [ -z "${{ secrets.BUILD_PROVISION_PROFILE_BASE64 }}" ] && missing="$missing BUILD_PROVISION_PROFILE_BASE64"
          if [ -n "$missing" ]; then
            echo "::error::Missing required secrets:$missing — see the header of this workflow."
            exit 1
          fi

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Generate the Xcode project
        run: xcodegen generate

      - name: Import signing identity
        env:
          CERT_B64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          PROFILE_B64: ${{ secrets.BUILD_PROVISION_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          CERT_PATH="$RUNNER_TEMP/cert.p12"
          PROFILE_PATH="$RUNNER_TEMP/profile.mobileprovision"
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"

          echo -n "$CERT_B64" | base64 --decode > "$CERT_PATH"
          echo -n "$PROFILE_B64" | base64 --decode > "$PROFILE_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$P12_PASSWORD" -A \
            -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: \
            -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"

          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp "$PROFILE_PATH" ~/Library/MobileDevice/Provisioning\ Profiles/

      - name: Archive
        run: |
          set -o pipefail
          xcodebuild \
            -project DeepSeekHarness.xcodeproj \
            -scheme DeepSeekHarness \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/DeepSeekHarness.xcarchive" \
            archive

      # Exporting from the archive lets Xcode apply the imported profile and
      # produce a properly signed .ipa.
      - name: Export IPA
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>development</string>
            <key>compileBitcode</key>
            <false/>
            <key>stripSwiftSymbols</key>
            <true/>
            <key>signingStyle</key>
            <string>manual</string>
          </dict>
          </plist>
          PLIST

          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/DeepSeekHarness.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export"

          mkdir -p artifacts
          find "$RUNNER_TEMP/export" -name "*.ipa" -exec cp {} artifacts/ \;
          ls -lh artifacts

      - name: Clean up the keychain
        if: always()
        run: security delete-keychain "$RUNNER_TEMP/app-signing.keychain-db" || true

      - name: Upload signed IPA
        uses: actions/upload-artifact@v4
        with:
          name: DeepSeekHarness-signed-ipa
          path: artifacts/*.ipa
          if-no-files-found: error
